name: Release PR

# Keeps a "chore(main): release X.Y.Z" PR open with the next version and
# changelog, worked out from the conventional commits on main. Merging it
# tags vX.Y.Z and creates a draft GitHub Release. Its outputs start the DMG
# jobs here: releases created with GITHUB_TOKEN don't trigger other workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft or published tag to build/retry (for example v0.7.0); leave empty to update the release PR
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.existing.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.existing.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - name: Select an existing release for a manual retry
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a tag such as v0.2.0' >&2; exit 1; }
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$existing" == "$TAG" ]] || { echo 'The release must already exist' >&2; exit 1; }
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo 'release_created=true' >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: inputs.release_tag == ''
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  build-dmg:
    name: Build release DMG
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release-signing
    concurrency:
      group: release-dmg-${{ needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      TAG: ${{ needs.release-please.outputs.tag_name }}
      SCOPE_SIGNING_MODE: developer-id
      SCOPE_TEAM_ID: ${{ vars.SCOPE_TEAM_ID }}
      SCOPE_NOTARY_KEY_ID: ${{ vars.SCOPE_NOTARY_KEY_ID }}
      SCOPE_NOTARY_ISSUER_ID: ${{ vars.SCOPE_NOTARY_ISSUER_ID }}
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      source_sha: ${{ steps.source.outputs.sha }}
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release source and toolchain
        id: source
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$TAG^{commit}")" ]]
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          python3 -c 'import sys; assert tuple(map(int, sys.argv[1].split("."))) >= (27, 2), "macOS 27.2 SDK required"' "$sdk"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked DMG packaging tools
        env:
          SCOPE_DMG_PYTHON: python3
        run: bash scripts/dmg/setup.sh
      - name: Import temporary signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.SCOPE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SCOPE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.SCOPE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$NOTARY_KEY_BASE64" ]]
          [[ -n "$SCOPE_TEAM_ID" && -n "$SCOPE_NOTARY_KEY_ID" && -n "$SCOPE_NOTARY_ISSUER_ID" ]]
          certificate="$RUNNER_TEMP/scope-developer-id.p12"
          key="$RUNNER_TEMP/scope-notary-key.p8"
          keychain="$RUNNER_TEMP/scope-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$key"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "SCOPE_NOTARY_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Build and verify the notarized DMG
        run: |
          set -euo pipefail
          scripts/release.sh
          app=build/ReleaseDerivedData/Build/Products/Release/Scope.app
          codesign --verify --deep --strict "$app"
          scripts/check-release-entitlements.sh "$app"
          dmg="build/release/Scope-${TAG#v}.dmg"
          codesign --verify --strict "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          hdiutil verify "$dmg"
          (cd build/release && shasum -a 256 -c "Scope-${TAG#v}.dmg.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: artifact
        with:
          name: dmg-${{ needs.release-please.outputs.tag_name }}
          path: |
            build/release/Scope-*.dmg
            build/release/Scope-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/scope-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/scope-developer-id.p12" "$RUNNER_TEMP/scope-notary-key.p8"

  publish-dmg:
    name: Attach DMG to release
    needs: build-dmg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-dmg-${{ needs.build-dmg.outputs.tag_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build-dmg.outputs.tag_name }}
      SOURCE_SHA: ${{ needs.build-dmg.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build-dmg.outputs.artifact_id }}
          path: dmg
          merge-multiple: true
      - name: Verify and attach the installer and checksum
        working-directory: dmg
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" == "$SOURCE_SHA" ]]
          existing="$(gh release view "$TAG" --json tagName --jq .tagName)"
          [[ "$existing" == "$TAG" ]]
          sha256sum --check --strict "Scope-${TAG#v}.dmg.sha256"
          gh release upload "$TAG" "Scope-${TAG#v}.dmg" "Scope-${TAG#v}.dmg.sha256" --clobber
      - name: Publish the verified release
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --json body --jq .body > "$notes"
          NOTES="$notes" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["NOTES"])
          body = path.read_text().split("<!-- scope-dmg-install -->", 1)[0].rstrip()
          tag = os.environ["TAG"]
          body += f"""

          <!-- scope-dmg-install -->
          ### Install Scope

          Download **Scope-{tag[1:]}.dmg**, open it, and drag **Scope** to **Applications**.
          Requires **macOS 27.2 or later**. The matching **.sha256** file verifies the download.
          Scope is Developer ID signed and notarized by Apple.
          """
          path.write_text(body)
          PY
          gh release edit "$TAG" --notes-file "$notes" --draft=false
