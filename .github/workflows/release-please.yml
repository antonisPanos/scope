name: Release PR

# Keeps a "chore(main): release X.Y.Z" PR open with the next version and
# changelog, worked out from the conventional commits on main. Merging it
# tags vX.Y.Z and creates the GitHub Release; scripts/release.sh then
# builds the DMG and attaches it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
