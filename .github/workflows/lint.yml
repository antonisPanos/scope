name: Lint

# Checks the Swift files a PR changes: swift-format for layout, SwiftLint for
# risky patterns. Runs on Linux, so it costs a tenth of a macOS job.
# Files nobody has touched since lint arrived are formatted in one pass later.
on:
  pull_request:
    paths: ["**.swift", ".swift-format", ".swiftlint.yml", ".github/workflows/lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: Changed Swift files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.diff.outputs.files }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.swift' | tr '\n' ' ')"
          else
            files="$(git ls-files '*.swift' | tr '\n' ' ')"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Swift files to check: ${files:-none}"

  swift-format:
    name: swift-format
    needs: changed
    if: needs.changed.outputs.files != ''
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check formatting
        run: swift format lint --strict --configuration .swift-format ${{ needs.changed.outputs.files }}

  swiftlint:
    name: SwiftLint
    needs: changed
    if: needs.changed.outputs.files != ''
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging ${{ needs.changed.outputs.files }}
