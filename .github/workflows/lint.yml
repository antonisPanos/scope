name: Lint

# Checks the Swift files a PR changes: swift-format for layout, SwiftLint for
# risky patterns. Runs on Linux, so it costs a tenth of a macOS job.
# Files nobody has touched since lint arrived are formatted in one pass later.
# No paths filter: the jobs skip themselves when no Swift file changed, so
# they always report and can be required checks on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: Changed Swift files
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.diff.outputs.files }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.swift' | tr '\n' ' ')"
          else
            files="$(git ls-files '*.swift' | tr '\n' ' ')"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Swift files to check: ${files:-none}"

  swift-format:
    name: swift-format
    needs: changed
    if: needs.changed.outputs.files != ''
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check formatting
        # File names come from the PR, so they reach the shell through an
        # environment variable and are never pasted into the script.
        env:
          FILES: ${{ needs.changed.outputs.files }}
        run: swift format lint --strict --configuration .swift-format $FILES

  swiftlint:
    name: SwiftLint
    needs: changed
    if: needs.changed.outputs.files != ''
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Lint
        env:
          FILES: ${{ needs.changed.outputs.files }}
        run: swiftlint lint --reporter github-actions-logging $FILES
