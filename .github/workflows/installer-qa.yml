name: Installer QA

on:
  pull_request:
    paths:
      - scripts/dmg/**
      - scripts/release.sh
      - scripts/check-release-entitlements.sh
      - .github/workflows/installer-qa.yml
      - .github/workflows/release-please.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SCOPE_SIGNING_MODE: ad-hoc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked packaging tools
        env:
          SCOPE_DMG_PYTHON: python3
        run: bash scripts/dmg/setup.sh
      - name: Build and verify an ad-hoc installer without Finder or Apple credentials
        run: scripts/release.sh
      - name: Check rejection and cleanup of malformed installers
        run: |
          set -euo pipefail
          images=(build/release/Scope-*.dmg)
          [[ "${#images[@]}" == 1 ]]
          build/dmg-venv/bin/python3 scripts/dmg/test-failures.py \
            build/ReleaseDerivedData/Build/Products/Release/Scope.app "${images[0]}"
          (cd build/release && shasum -a 256 -c Scope-*.dmg.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-preview
          path: |
            build/release/Scope-*.dmg
            build/release/Scope-*.dmg.sha256
          if-no-files-found: error
          retention-days: 7
