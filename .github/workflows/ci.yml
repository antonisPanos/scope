name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-tests:
    name: Bounded no-mount tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Run bounded profile in the CI sandbox
        run: python3 scripts/test-bounded.py

  engine-tests:
    name: Engine tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Toolchain
        run: xcodebuild -version && swift --version
      # One suite at a time. The test helpers make blocking calls (hdiutil,
      # writing big files) on the shared concurrency pool, and suites running
      # side by side on a 3-core runner starved each other's tasks for
      # seconds, which made the timing checks fail.
      - name: Run engine tests
        working-directory: Packages/ScopeEngine
        run: swift test --no-parallel

  engine-tests-tsan:
    name: Engine tests (Thread Sanitizer)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      # The same tests with data races reported as failures.
      - name: Run engine tests under Thread Sanitizer
        working-directory: Packages/ScopeEngine
        run: swift test --no-parallel --sanitize=thread

  app-build:
    name: Build app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      # Scope requires the macOS 27.2 SDK. GitHub's runners don't offer it
      # yet; until they do, this job reports that and skips the build.
      - name: Check for the macOS 27.2 SDK
        id: sdk
        run: |
          version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "SDK $version"
          if [ "$(printf '%s\n27.2\n' "$version" | sort -V | head -1)" = "27.2" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::macOS SDK $version on this runner is older than 27.2; skipping the app build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Scope Dev and Scope
        if: steps.sdk.outputs.available == 'true'
        run: |
          for scheme in "Scope Dev" "Scope"; do
            xcodebuild -project Scope.xcodeproj -scheme "$scheme" -derivedDataPath build/DerivedData build
          done
      - name: Run the app tests
        if: steps.sdk.outputs.available == 'true'
        run: xcodebuild -project Scope.xcodeproj -scheme "Scope Dev" -derivedDataPath build/DerivedData test -only-testing:ScopeTests
