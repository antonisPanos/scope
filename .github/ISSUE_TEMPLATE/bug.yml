name: Bug
description: Something in Scope doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Scope did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
  - type: input
    id: version
    attributes:
      label: Scope version
      description: From Scope > About Scope, e.g. 0.2.0 (41) or 0.2.0+a1b2c3d for a dev build.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "27.2"
